<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wildfire Tracker — Rich fire detail panel prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<style>
/* ============================================================
   PROTOTYPE — throwaway. Three placements for the RICH FIRE
   DETAIL PANEL on the rebuilt tracker, switchable via ?v=a|b|c.
   DESIGN SYSTEM: WILDLAND LEDGER (map ticket 03) — locked tokens.
   DATA: NASA EONET v3 mock, field-for-field from ticket 01.
   QUESTION: where does the rich detail panel live, and what does
   it promise? Fields below are ONLY what EONET returns: title,
   description (nullable), size acres (magnitude), last update,
   status, sources[], coordinates. NOT promised: containment,
   cause, agency, imagery — those link out to IRWIN/GDACS.
   ============================================================ */

:root {
  --c-bg: #11160f;
  --c-panel: #1a2118;
  --c-border: rgba(242,236,226,.12);
  --c-border-2: rgba(242,236,226,.22);
  --c-bone: #f1ece2;
  --c-muted: #a7b09d;
  --c-faint: #70795f;
  --c-accent: #f2672b;
  --bar: #11151b;
  --bar-text: #eef1f5;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: 'Space Grotesk', sans-serif; overflow: hidden; }

#map { position: fixed; inset: 0; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#ui > * { pointer-events: auto; }

body[data-v="a"] .maplibregl-canvas,
body[data-v="b"] .maplibregl-canvas,
body[data-v="c"] .maplibregl-canvas,
body[data-v="d"] .maplibregl-canvas,
body[data-v="e"] .maplibregl-canvas,
body[data-v="f"] .maplibregl-canvas {
  filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.7);
}
.maplibregl-ctrl-attrib { background: rgba(17,22,15,.75); color: #a7b09d; }
.maplibregl-ctrl-attrib a { color: #d5dacb; }

.fi { color: var(--c-faint); font-family: 'JetBrains Mono', monospace; font-size: 10px; }

/* ============================================================
   SHARED SHELL — WILDLAND LEDGER (lock from ticket 03)
   ============================================================ */
.ledger {
  position: absolute; top: 0; left: 0; bottom: 0; width: 372px; z-index: 4;
  background: var(--c-panel); border-right: 1px solid var(--c-border);
  color: var(--c-bone); display: flex; flex-direction: column;
}
.ledger-head { padding: 26px 24px 14px; border-bottom: 1px solid var(--c-border); }
.masthead { font-weight: 700; font-size: 30px; letter-spacing: -.02em; line-height: 1; font-family: 'Space Grotesk', sans-serif; }
.masthead .flame { color: var(--c-accent); display: inline-block; margin-right: 2px; vertical-align: top; }
.sub { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--c-muted); font-size: 12px; flex-wrap: wrap; }
.sub .live { color: var(--c-accent); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.sub .live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .3; } }

.filterbar { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.frow { display: flex; align-items: center; gap: 6px; }
.frank { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--c-faint); min-width: 52px; }
.seg { display: flex; gap: 2px; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 8px; padding: 2px; flex: 1; }
.seg button { flex: 1; background: transparent; border: 0; color: var(--c-muted); font-size: 11px; padding: 5px 0; border-radius: 6px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 500; white-space: nowrap; }
.seg button.active { background: var(--c-accent); color: #13160f; font-weight: 700; }
.search-wrap { position: relative; margin-top: 2px; }
.search-wrap input {
  width: 100%; background: var(--c-bg); border: 1px solid var(--c-border); color: var(--c-bone);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 7px 10px; border-radius: 8px; outline: none;
}
.search-wrap input::placeholder { color: var(--c-faint); }
.search-wrap input:focus { border-color: var(--c-accent); }

.entries { flex: 1; overflow: auto; padding: 8px 0 12px; counter-reset: ledger; }
.entry {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 14px; align-items: start;
  padding: 13px 24px 13px 22px; cursor: pointer; border-left: 2px solid transparent; position: relative;
}
.entry:hover { background: rgba(242,236,226,.04); }
.entry.selected { border-left-color: var(--c-accent); background: rgba(242,103,43,.08); }
.entry .num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c-faint); padding-top: 3px; counter-increment: ledger; }
.entry .num::before { content: counter(ledger, decimal-leading-zero); }
.entry .name { font-size: 14px; font-weight: 600; line-height: 1.25; color: var(--c-bone); }
.entry .meta { grid-column: 2 / -1; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--c-faint); margin-top: 3px; }
.entry .acres { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--c-accent); font-weight: 600; grid-row: 1; }
.empty { padding: 22px 18px; color: var(--c-faint); font-size: 12px; text-align: center; }
.clearall { display: inline-block; margin-top: 8px; color: var(--c-accent); cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-decoration: underline; text-underline-offset: 2px; }

.ticker {
  position: absolute; left: 372px; right: 0; bottom: 0; z-index: 3;
  background: rgba(26,33,24,.92); backdrop-filter: blur(10px);
  border-top: 1px solid var(--c-border); display: flex; align-items: stretch; color: var(--c-bone);
}
.stat { flex: 1; padding: 10px 18px; border-right: 1px solid var(--c-border); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .k { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--c-faint); }
.stat .v { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -.02em; margin-top: 2px; line-height: 1; }
.stat .v.accent { color: var(--c-accent); }
.stat .s { font-size: 10px; color: var(--c-muted); margin-top: 3px; }

/* ============================================================
   MARKERS
   ============================================================ */
.fire-marker { cursor: pointer; }
.fire-marker .glyph { width: 26px; height: 26px; display: grid; place-items: center; }
.fire-marker .glyph svg { width: 20px; height: 20px; color: var(--c-accent); filter: drop-shadow(0 0 6px rgba(242,103,43,.85)); }
.fire-marker.selected .glyph::after { content: ''; position: absolute; inset: -5px; border: 1px solid var(--c-accent); border-radius: 50%; }
.fire-marker .tip {
  position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
  background: var(--c-panel); border: 1px solid var(--c-border-2); color: var(--c-bone);
  font-family: 'JetBrains Mono', monospace; font-size: 10px; white-space: nowrap;
  padding: 5px 9px; border-radius: 6px; opacity: 0; transition: opacity .12s; pointer-events: none;
}
.fire-marker:hover .tip { opacity: 1; }

/* ============================================================
   SHARED PANEL CONTENT (fields grounded in ticket 01)
   ============================================================ */
.dk { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--c-faint); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-top: 1px solid var(--c-border); font-size: 12px; }
.row .k { color: var(--c-faint); font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; }
.row .v { color: var(--c-bone); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right; word-break: break-word; }
.row .v.accent { color: var(--c-accent); }
.panel-title { margin: 8px 0 0; font-size: 19px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; color: var(--c-bone); }
.panel-desc { color: var(--c-muted); font-size: 13px; line-height: 1.5; margin: 8px 0 0; }
.bigacres { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 600; color: var(--c-accent); line-height: 1; letter-spacing: -.02em; }
.bigacres .u { font-size: 13px; color: var(--c-muted); font-weight: 400; margin-left: 6px; }
.absent-note {
  margin-top: 14px; padding: 10px 12px; background: var(--c-bg); border: 1px dashed var(--c-border-2);
  border-radius: 8px; font-size: 11px; color: var(--c-muted); line-height: 1.5;
}
.absent-note a { color: var(--c-accent); text-decoration: none; }
.absent-note a:hover { text-decoration: underline; }
.srcbtn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  background: var(--c-accent); color: #13160f; font-weight: 700; font-size: 12px;
  padding: 9px 14px; border-radius: 8px; cursor: pointer; font-family: 'Space Grotesk', sans-serif;
}
.srcbtn:hover { filter: brightness(1.08); }
.srcbtn.ghost { background: var(--c-panel); border: 1px solid var(--c-border-2); color: var(--c-bone); font-weight: 500; }

/* ============================================================
   VARIANT A — SIDEBAR (rail-integrated). Detail replaces the
   ledger list inside the 372px rail. Map untouched.
   ============================================================ */
.sidebar-panel { flex: 1; overflow: auto; padding: 18px 24px 24px; }
.sidebar-panel .back {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--c-border);
  color: var(--c-muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer;
  padding: 5px 10px; border-radius: 6px; margin-bottom: 18px;
}
.sidebar-panel .back:hover { color: var(--c-bone); border-color: var(--c-border-2); }
.sidebar-panel .hero { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* ============================================================
   VARIANT B — POPOVER (floating docked card over the map).
   Map stays interactive. Anchored top-right above the ticker.
   ============================================================ */
.pop-panel {
  position: absolute; right: 18px; top: 18px; bottom: 64px; width: 340px; z-index: 6;
  background: var(--c-panel); border: 1px solid var(--c-border-2); border-radius: 14px;
  color: var(--c-bone); display: none; flex-direction: column; overflow: hidden;
  box-shadow: 0 18px 48px rgba(0,0,0,.45);
}
.pop-panel.open { display: flex; }
.pop-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--c-border); }
.pop-head .drag { width: 10px; height: 3px; border-radius: 2px; background: var(--c-faint); flex: none; }
.pop-head .which { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--c-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-head .close { background: none; border: 0; color: var(--c-muted); font-size: 16px; cursor: pointer; padding: 0 2px; }
.pop-head .close:hover { color: var(--c-bone); }
.pop-shade { position: absolute; inset: 0; z-index: 5; background: rgba(17,22,15,.28); display: none; }
.pop-shade.on { display: block; }

/* ============================================================
   VARIANT C — FULL-SCREEN ROUTE. Detail takes over the whole
   surface; map dims behind. Back returns to the map.
   ============================================================ */
.fs-panel {
  position: fixed; inset: 0; z-index: 10; background: rgba(17,22,15,.97);
  color: var(--c-bone); display: none; flex-direction: column; overflow: auto;
}
.fs-panel.open { display: flex; }
.fs-top { padding: 22px 28px 0; display: flex; align-items: center; justify-content: space-between; }
.fs-top .back {
  display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--c-border-2);
  color: var(--c-muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer;
  padding: 6px 12px; border-radius: 6px;
}
.fs-top .back:hover { color: var(--c-bone); }
.fs-body { max-width: 620px; margin: 0 auto; padding: 34px 28px 64px; width: 100%; }
.fs-body .kicker { color: var(--c-accent); }
.fs-body .panel-title { font-size: 40px; letter-spacing: -.025em; line-height: 1.05; margin: 12px 0 0; }
.fs-body .panel-desc { font-size: 15px; margin-top: 14px; max-width: 52ch; }
.fs-hero { display: flex; align-items: baseline; gap: 14px; margin: 28px 0 8px; padding-bottom: 20px; border-bottom: 1px solid var(--c-border); flex-wrap: wrap; }
.fs-hero .bigacres { font-size: 64px; }
.fs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.fs-grid .row { padding: 11px 0; }
.fs-srcs { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.fs-note { margin-top: 34px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--c-faint); }

/* ============================================================
   MOBILE — <820px every variant drops the rail/map and becomes
   a bottom sheet / takeover detail. (Behavior being tested.)
   ============================================================ */
@media (max-width: 820px) {
  .ledger { width: 100%; bottom: auto; max-height: 46vh; border-bottom: 1px solid var(--c-border); }
  .ledger-head { padding: 18px 18px 12px; }
  .entries { max-height: none; }
  .ticker { left: 0; bottom: 0; position: absolute; }
  .ticker .stat { padding: 8px 12px; }
  .ticker .stat .v { font-size: 15px; }
  .pop-panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; border-radius: 18px 18px 0 0; max-height: 62vh; border-left: 0; border-right: 0; border-bottom: 0; border-top: 1px solid var(--c-border-2); }
  .pop-panel .pop-head { justify-content: center; }
  .pop-shade { display: none !important; }
  .fs-body .panel-title { font-size: 28px; }
  .fs-hero .bigacres { font-size: 44px; }
  .fs-grid { grid-template-columns: 1fr; }
  .sidebar-panel { padding-bottom: 140px; }
}

/* ============================================================
   FLOATING SWITCHER (prototype tooling)
   ============================================================ */
#switcher {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 4px;
  background: var(--bar); color: var(--bar-text);
  border-radius: 999px; padding: 5px 6px;
  box-shadow: 0 8px 28px rgba(0,0,0,.4);
  font-family: 'JetBrains Mono', monospace; white-space: nowrap;
}
#switcher .name { padding: 0 10px; font-size: 11px; letter-spacing: .05em; }
#switcher .name b { color: var(--bar-text); }
#switcher .name .hint { opacity: .55; }
#switcher button {
  background: transparent; border: 0; color: var(--bar-text); font-size: 15px;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-family: inherit;
}
#switcher button:hover { background: rgba(255,255,255,.14); }
@media (max-width: 820px) { #switcher { bottom: 64px; } }
</style>
</head>
<body>

<div id="map"></div>
<div id="ui"></div>
<div id="switcher"></div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
/* ============================================================
   MOCK DATA — NASA EONET v3 shape, field-for-field from
   ticket 01. Only these fields exist: id, title, description
   (nullable), link, closed (null while open), sources[{id,url}],
   geometry[{magnitudeValue, magnitudeUnit, date, type, coordinates}].
   ============================================================ */
const EVENTS = [
  { id:'EONET_22430', title:'Wildfire Harris, Rosebud, Montana', description:'30 Miles SW from Ashland, MT', closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-MTMCD-000676' }],
    geometry:[{ magnitudeValue:924.3, magnitudeUnit:'acres', date:'2026-08-09T16:55:00Z', type:'Point', coordinates:[-106.634317,45.195183] }] },
  { id:'EONET_22424', title:'Wildfire WEISER KNOLL, Fremont, Wyoming', description:'13 Miles SE from Lander, WY', closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-WYWBD-000294' }],
    geometry:[{ magnitudeValue:8500, magnitudeUnit:'acres', date:'2026-08-09T16:32:00Z', type:'Point', coordinates:[-108.607547,42.636437] }] },
  { id:'EONET_22445', title:'Wildfire Cougar Creek, Wallowa, Oregon', description:null, closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-ORWF-000441' }],
    geometry:[{ magnitudeValue:3120, magnitudeUnit:'acres', date:'2026-08-09T14:20:00Z', type:'Point', coordinates:[-117.2391,45.2345] }] },
  { id:'EONET_22452', title:'Wildfire Lost Lake, Chelan, Washington', description:'20 Miles W of Lake Chelan', closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-WACR-000908' }],
    geometry:[{ magnitudeValue:22450, magnitudeUnit:'acres', date:'2026-08-09T15:44:00Z', type:'Point', coordinates:[-120.9011,48.0521] }] },
  { id:'EONET_22440', title:'Wildfire Ponderosa, Plumas, California', description:'8 Miles NE of Quincy', closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-CAPLF-006511' }],
    geometry:[{ magnitudeValue:4890, magnitudeUnit:'acres', date:'2026-08-09T13:02:00Z', type:'Point', coordinates:[-120.8611,39.9884] }] },
  { id:'EONET_22461', title:'Wildfire Skull Ridge, Cibola, New Mexico', description:null, closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-NMNOF-001822' }],
    geometry:[{ magnitudeValue:null, magnitudeUnit:'acres', date:'2026-08-09T12:10:00Z', type:'Point', coordinates:[-107.3542,35.0111] }] },
  { id:'EONET_22469', title:'Wildfire Beaver Pond, Lincoln, Montana', description:'12 Miles W of Eureka', closed:null,
    sources:[{ id:'IRWIN', url:'https://irwin.doi.gov/observer/incidents/2026-MTKWF-002204' }],
    geometry:[{ magnitudeValue:760, magnitudeUnit:'acres', date:'2026-08-09T10:48:00Z', type:'Point', coordinates:[-115.1641,48.9124] }] },
  { id:'EONET_22476', title:'Wildfire June South, Juneau, Alaska', description:null, closed:null,
    sources:[{ id:'GDACS', url:'https://www.gdacs.org/' }],
    geometry:[{ magnitudeValue:15700, magnitudeUnit:'acres', date:'2026-08-08T20:15:00Z', type:'Point', coordinates:[-134.4211,58.3534] }] },
  { id:'EONET_22387', title:'Wildfire in Australia 1030307', description:null, closed:'2026-08-09T00:00:00Z',
    sources:[{ id:'GDACS', url:'https://www.gdacs.org/' }],
    geometry:[{ magnitudeValue:29000, magnitudeUnit:'acres', date:'2026-08-08T22:00:00Z', type:'Point', coordinates:[146.7311,-37.6632] }] },
  { id:'EONET_22458', title:'Wildfire in Brazil 1030351', description:null, closed:'2026-08-10T00:00:00Z',
    sources:[{ id:'GDACS', url:'https://www.gdacs.org/' }],
    geometry:[{ magnitudeValue:41200, magnitudeUnit:'acres', date:'2026-08-09T18:30:00Z', type:'Point', coordinates:[-51.3211,-12.8543] }] },
];

const VARIANTS = {
  a: { name:'Sidebar', desc:'rail-integrated inspector' },
  b: { name:'Popover', desc:'floating docked card' },
  c: { name:'Full-screen', desc:'route takeover' },
};

let map;
let markers = [];
const state = { v: 'a', filter: 'open', recency: 'any', mag: 'any', q: '', selected: null };

const FLAME_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 3-1.5 4.5-2.8 6.4C8 10.2 7.2 11.7 7.2 13.5a4.8 4.8 0 0 0 9.6 0c0-1.3-.4-2.4-1-3.5-.4.7-.9 1.1-1.5 1.3.3-2.6-.4-6-2.3-9.3z"/><path d="M12 22a6.5 6.5 0 0 1-3.9-11.6c.5 1.8 1.6 2.8 2.9 3.5-.2-1.9.3-3.6 1.5-5.1 2.6 2.2 4 5.2 4 8.2a6.5 6.5 0 0 1-4.5 5z"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';

function geo(e){ return e.geometry[0]; }
function acres(e){ const g = geo(e); return g && g.magnitudeValue != null ? g.magnitudeValue : null; }
function timeAgo(iso){
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function fmtAcres(n){
  if (n == null) return '—';
  return n >= 1000 ? (Math.round(n/100)/10).toFixed(1)+'k' : Math.round(n).toString();
}
function fmtAcresFull(n){ return n == null ? 'Not reported' : Math.round(n).toLocaleString()+' acres'; }
function humanDate(iso){ return new Date(iso).toUTCString().replace(' GMT',''); }
function sourceName(e){ return e.sources && e.sources[0] ? e.sources[0].id : '—'; }
function sourceUrl(e){ return e.sources && e.sources[0] ? e.sources[0].url : '#'; }
function eonetUrl(e){ return 'https://eonet.gsfc.nasa.gov/api/v3/events/'+e.id; }

function visibleEvents(){
  const inWindowOf = days => Date.now() - days*86400*1000;
  return EVENTS.filter(e => {
    if (state.filter === 'open' && e.closed) return false;
    const g = geo(e);
    if (state.recency === '24h' && new Date(g.date).getTime() < inWindowOf(1)) return false;
    if (state.recency === '7d' && new Date(g.date).getTime() < inWindowOf(7)) return false;
    if (state.mag === '100' && !(acres(e) != null && acres(e) > 100)) return false;
    if (state.mag === '1k' && !(acres(e) != null && acres(e) > 1000)) return false;
    if (state.mag === '10k' && !(acres(e) != null && acres(e) > 10000)) return false;
    if (state.q){
      const q = state.q.toLowerCase();
      const hay = (e.title + ' ' + (e.description || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------- markers ---------- */
function renderMarkers(){
  markers.forEach(m => m.remove());
  markers = [];
  visibleEvents().forEach(e => {
    const g = geo(e);
    if (!g || !g.coordinates) return;
    const el = document.createElement('div');
    el.className = 'fire-marker' + (state.selected === e.id ? ' selected' : '');
    el.innerHTML = '<div class="glyph">'+FLAME_SVG+'</div><div class="tip">'+e.title+' · '+fmtAcres(acres(e))+' ac</div>';
    el.addEventListener('click', () => select(e.id));
    const m = new maplibregl.Marker({ element: el })
      .setLngLat([g.coordinates[0], g.coordinates[1]])
      .addTo(map);
    markers.push(m);
  });
}

function select(id){
  state.selected = (state.selected === id && state.v !== 'c') ? null : id;
  renderUI();
  renderMarkers();
}
function setSelected(id){
  state.selected = id || null;
  renderUI();
  renderMarkers();
}
function deselect(){
  state.selected = null;
  renderUI();
  renderMarkers();
}

/* ---------- shared panel field markup ---------- */
function fieldRow(k, v, accent){
  return `<div class="row"><span class="k">${k}</span><span class="v${accent ? ' accent' : ''}">${v}</span></div>`;
}
function absentNote(sel){
  const src = sel.sources[0];
  return `<div class="absent-note">Containment %, cause, and agency live on the ${src ? src.id : 'source'} incident page — <a href="${src ? src.url : '#'}" target="_blank" rel="noopener">not in the EONET feed</a>. Imagery is linked from there too.</div>`;
}
function sourceButtons(sel){
  return sel.sources.map(s => `<a class="srcbtn" href="${s.url}" target="_blank" rel="noopener">${ARROW.replace('stroke-width="2.4"','stroke-width="2"')} ${s.id} incident</a>`).join('');
}

/* ---------- render + wiring ---------- */
function renderUI(){
  const ui = document.getElementById('ui');
  document.body.dataset.v = state.v;
  ui.innerHTML = state.v === 'a' ? renderSidebar() : state.v === 'b' ? renderPopover() : renderFullscreen();

  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { state.q = q.value; renderUI(); resetSelected(); renderMarkers(); });
  ui.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { state.filter = b.dataset.f; resetSelected(); renderUI(); renderMarkers(); }));
  ui.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { state.recency = b.dataset.r; resetSelected(); renderUI(); renderMarkers(); }));
  ui.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { state.mag = b.dataset.m; resetSelected(); renderUI(); renderMarkers(); }));
  ui.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => select(el.dataset.id)));
  ui.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => deselect()));
  ui.querySelectorAll('[data-clear]').forEach(el => el.addEventListener('click', () => {
    state.filter = 'open'; state.recency = 'any'; state.mag = 'any'; state.q = '';
    resetSelected(); renderUI(); renderMarkers();
  }));
  if (state.v === 'b') ui.querySelectorAll('[data-shade]').forEach(el => el.addEventListener('click', () => deselect()));

  const sw = document.getElementById('switcher');
  sw.innerHTML = `
    <button id="sw-prev" aria-label="Previous variant">‹</button>
    <span class="name"><b>${state.v.toUpperCase()}</b> · ${VARIANTS[state.v].name} <span class="hint">— ${VARIANTS[state.v].desc}</span></span>
    <button id="sw-next" aria-label="Next variant">›</button>`;
  document.getElementById('sw-prev').addEventListener('click', () => cycle(-1));
  document.getElementById('sw-next').addEventListener('click', () => cycle(1));
  renderMarkers();
}

function resetSelected(){ state.selected = null; }

function setVariant(v){
  state.v = v;
  state.selected = null;
  const url = new URL(location.href);
  url.searchParams.set('v', v);
  history.replaceState(null, '', url);
  renderUI();
}
function cycle(dir){
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(state.v);
  setVariant(keys[(i + dir + keys.length) % keys.length]);
}

function initMap(){
  map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-107, 42],
    zoom: 3.2,
    attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  map.on('load', renderUI);
}

const urlV = new URL(location.href).searchParams.get('v');
if (VARIANTS[urlV]) state.v = urlV;
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { cycle(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { cycle(1); e.preventDefault(); }
  if (e.key === 'Escape' && state.selected) { deselect(); e.preventDefault(); }
});

initMap();
</script>
